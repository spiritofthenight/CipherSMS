
name: CipherSMS Beta Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CipherSMS ${{ github.ref_name }}
          draft: true
          prerelease: true
          body: |
            ## CipherSMS — Early Beta

            This is an experimental beta for volunteer testing.

            - Android 9 or newer is required.
            - Please test with non-sensitive sample messages only.
            - This software has not been independently security-audited.
            - Please report bugs and unexpected behavior.

            This is a debug-signed testing build, not a production release.
          files: app/build/outputs/apk/debug/app-debug.apk
